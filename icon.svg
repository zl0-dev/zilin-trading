<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="greenCandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
    <linearGradient id="redCandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="60" y1="380" x2="452" y2="380" stroke="#2d4a7a" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.4"/>
  <line x1="60" y1="310" x2="452" y2="310" stroke="#2d4a7a" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.4"/>
  <line x1="60" y1="240" x2="452" y2="240" stroke="#2d4a7a" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.4"/>
  <line x1="60" y1="170" x2="452" y2="170" stroke="#2d4a7a" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.4"/>

  <!-- Candles -->
  <!-- Bullish candle 1 - large green -->
  <rect x="85" y="200" width="40" height="140" rx="4" fill="url(#greenCandle)"/>
  <line x1="105" y1="170" x2="105" y2="200" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <line x1="105" y1="340" x2="105" y2="370" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>

  <!-- Bearish candle 2 - small red -->
  <rect x="150" y="260" width="40" height="80" rx="4" fill="url(#redCandle)"/>
  <line x1="170" y1="240" x2="170" y2="260" stroke="#ff5252" stroke-width="4" stroke-linecap="round"/>
  <line x1="170" y1="340" x2="170" y2="370" stroke="#ff5252" stroke-width="4" stroke-linecap="round"/>

  <!-- Bullish candle 3 - medium green -->
  <rect x="215" y="220" width="40" height="100" rx="4" fill="url(#greenCandle)"/>
  <line x1="235" y1="190" x2="235" y2="220" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <line x1="235" y1="320" x2="235" y2="360" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>

  <!-- Bearish candle 4 - small red -->
  <rect x="280" y="280" width="40" height="60" rx="4" fill="url(#redCandle)"/>
  <line x1="300" y1="260" x2="300" y2="280" stroke="#ff5252" stroke-width="4" stroke-linecap="round"/>
  <line x1="300" y1="340" x2="300" y2="365" stroke="#ff5252" stroke-width="4" stroke-linecap="round"/>

  <!-- Bullish candle 5 - large green (biggest gain) -->
  <rect x="345" y="170" width="40" height="180" rx="4" fill="url(#greenCandle)"/>
  <line x1="365" y1="140" x2="365" y2="170" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>
  <line x1="365" y1="350" x2="365" y2="380" stroke="#00e676" stroke-width="4" stroke-linecap="round"/>

  <!-- Trend line going up -->
  <polyline points="105,370 170,370 235,360 300,365 365,380" fill="none" stroke="#ff9100" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Title text -->
  <text x="256" y="460" text-anchor="middle" fill="white" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="800" letter-spacing="2">
    <tspan fill="#ff9100">子</tspan><tspan fill="white">霖</tspan>
  </text>

  <!-- Subtitle -->
  <text x="256" y="495" text-anchor="middle" fill="#8899aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="500" letter-spacing="4">TRADING</text>

  <!-- Corner accent -->
  <circle cx="80" cy="80" r="6" fill="#ff9100" opacity="0.6"/>
  <circle cx="432" cy="80" r="6" fill="#ff9100" opacity="0.6"/>
</svg>
